baseURL = "/"
title = "RL Digital API Documentation"
locale = "de-DE"
defaultContentLanguage = "de"
enableRobotsTXT = false
enableGitInfo = true

[module]
proxy = "direct"

[module.hugoVersion]
extended = true
min = "0.160.1"

[[module.imports]]
path = "github.com/google/docsy/theme"
disable = false

[params]
offlineSearch = true
copyright = "Arvato Systems"

[params.ui]
breadcrumb_disable = false
sidebar_menu_compact = false
sidebar_search_disable = false
navbar_logo = false
footer_about_disable = true

[markup]

[markup.highlight]
noClasses = false
style = "github"

[markup.goldmark.renderer]
unsafe = true
