name: Build API documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Hugo Extended
        shell: pwsh
        run: |
          $url = 'https://github.com/gohugoio/hugo/releases/download/v0.167.0/hugo_extended_0.167.0_windows-amd64.zip'
          Invoke-WebRequest $url -OutFile hugo.zip
          Expand-Archive hugo.zip -DestinationPath "$env:RUNNER_TEMP\hugo"
          "$env:RUNNER_TEMP\hugo" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        run: |
          npm install
          hugo mod npm pack
          npm install
      - name: Build
        run: npm run build
