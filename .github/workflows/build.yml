name: Build API documentation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Install native Dart Sass
        run: |
          wget -q https://github.com/sass/dart-sass/releases/download/1.105.1/dart-sass-1.105.1-linux-x64.tar.gz
          tar -xzf dart-sass-1.105.1-linux-x64.tar.gz
          echo "$PWD/dart-sass" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          npm install
          hugo mod tidy
          hugo mod npm pack
          npm install

      - name: Verify Environment
        run: |
          which sass
          sass --version
          hugo env

      - name: Build
        run: hugo --gc

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public